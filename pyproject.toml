[project]
name = "detection"
version = "0.0.2"
description = "Training RT-DETRv2 for tooth detection"
readme = "README.md"
authors = [
    { name = "Andreas Werdich", email = "andreas_werdich@hms.harvard.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy<2.0",
    "transformers",
]

[project.scripts]
detection = "detection:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
transformers = { git = "https://github.com/huggingface/transformers" }
