[project]
name = "detection"
version = "0.0.2"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Andreas Werdich", email = "andreas_werdich@hms.harvard.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "albumentations>=2.0.6",
    "datasets>=3.5.1",
    "numpy<2.0",
    "scikit-image>=0.25.2",
    "scikit-learn>=1.6.1",
    "supervision>=0.24.0",
    "tqdm>=4.67.1",
    "transformers",
]

[project.scripts]
detection = "detection:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
transformers = { git = "https://github.com/huggingface/transformers" }

[dependency-groups]
dev = [
    "ipywidgets>=8.1.6",
    "jupyterlab>=4.4.1",
    "seaborn>=0.13.2",
]
